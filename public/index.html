<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const COLORS = {
  bg: '#0e1116', card: '#161b22', cardRaised: '#1c2229',
  border: 'rgba(255,255,255,0.08)', gold: '#d4a24c', goldDim: '#8a6b32',
  up: '#ff5252', down: '#2ecc71', blue: '#4da6ff', pink: '#ff85d1', orange: '#ffab5c', yellow: '#ffd23f',
  textPrimary: '#f0f0ec', textSecondary: '#b8c0cc', textMuted: '#8a93a3',
};

// ================= 技術指標計算(與PowerShell報告邏輯一致) =================

function sma(values, period) {
  if (values.length < period) return null;
  const slice = values.slice(-period);
  return slice.reduce((a, b) => a + b, 0) / period;
}

function computeKD(closes, highs, lows, period = 9) {
  const n = closes.length;
  if (n < period) return null;
  let K = 50, D = 50;
  const kHistory = [];
  for (let i = period - 1; i < n; i++) {
    const hh = Math.max(...highs.slice(i - period + 1, i + 1));
    const ll = Math.min(...lows.slice(i - period + 1, i + 1));
    const rsv = hh === ll ? 50 : ((closes[i] - ll) / (hh - ll)) * 100;
    K = (K * 2 + rsv) / 3;
    D = (D * 2 + K) / 3;
    kHistory.push(K);
  }
  return { K: +K.toFixed(2), D: +D.toFixed(2), recentK: kHistory.slice(-3) };
}

// 起漲點判斷:「整理後帶量突破」+「K線反轉型態」兩者必須同時成立,單一條件不算,
// 與每日報表PowerShell版本使用完全相同的邏輯與門檻值,確保兩邊判斷結果一致
function computeConsolidationBreakout(closes, highs, lows, volumes, lookbackDays = 15) {
  const n = closes.length;
  if (n < lookbackDays + 1 || !volumes || volumes.length < lookbackDays + 1) return null;
  const rangeHighs = highs.slice(n - 1 - lookbackDays, n - 1);
  const rangeLows = lows.slice(n - 1 - lookbackDays, n - 1);
  const rangeVols = volumes.slice(n - 1 - lookbackDays, n - 1);
  const rangeHigh = Math.max(...rangeHighs);
  const rangeLow = Math.min(...rangeLows);
  const rangeAvgVol = rangeVols.reduce((a, b) => a + b, 0) / rangeVols.length;
  if (rangeLow <= 0) return null;
  const rangeWidthPct = ((rangeHigh - rangeLow) / rangeLow) * 100;
  const isConsolidating = rangeWidthPct <= 15;
  const todayClose = closes[n - 1];
  const todayVol = volumes[n - 1];
  const breaksHigh = todayClose > rangeHigh;
  const volRatio = rangeAvgVol > 0 ? todayVol / rangeAvgVol : 0;
  const volSurge = volRatio >= 1.0;
  return {
    isConsolidating, rangeWidthPct: +rangeWidthPct.toFixed(1), rangeHigh: +rangeHigh.toFixed(2),
    breaksHigh, volRatio: +volRatio.toFixed(2), volSurge,
    confirmed: isConsolidating && breaksHigh && volSurge,
  };
}

function computeBullishCandlePattern(opens, highs, lows, closes) {
  const n = closes.length;
  if (n < 3 || !opens || opens.length < 3) return null;
  const patterns = [];

  const y = n - 2, t = n - 1;
  const yBearish = closes[y] < opens[y];
  const tBullish = closes[t] > opens[t];
  if (yBearish && tBullish && opens[t] <= closes[y] && closes[t] >= opens[y]) {
    patterns.push('長紅吞噬');
  }

  const d1 = n - 3, d2 = n - 2, d3 = n - 1;
  const allBullish = closes[d1] > opens[d1] && closes[d2] > opens[d2] && closes[d3] > opens[d3];
  const risingCloses = closes[d2] > closes[d1] && closes[d3] > closes[d2];
  const opensWithinPrevBody = (opens[d2] >= opens[d1] && opens[d2] <= closes[d1]) && (opens[d3] >= opens[d2] && opens[d3] <= closes[d2]);
  if (allBullish && risingCloses && opensWithinPrevBody) {
    patterns.push('紅三兵');
  }

  const day1Bearish = closes[d1] < opens[d1];
  const day1BodySize = Math.abs(opens[d1] - closes[d1]);
  const day2BodySize = Math.abs(opens[d2] - closes[d2]);
  const day3Bullish = closes[d3] > opens[d3];
  const day3ClosesIntoDay1Body = closes[d3] > (opens[d1] + closes[d1]) / 2;
  const day2IsSmall = day1BodySize > 0 && (day2BodySize / day1BodySize) < 0.4;
  if (day1Bearish && day2IsSmall && day3Bullish && day3ClosesIntoDay1Body) {
    patterns.push('早晨之星');
  }

  return { patterns, hasBullishPattern: patterns.length > 0 };
}

function computeRallyStartSignal(opens, highs, lows, closes, volumes) {
  const breakout = computeConsolidationBreakout(closes, highs, lows, volumes);
  const pattern = computeBullishCandlePattern(opens, highs, lows, closes);
  if (!breakout || !pattern) return null;
  const confirmed = breakout.confirmed && pattern.hasBullishPattern;
  return {
    confirmed, breakout, pattern,
    summary: confirmed ? `🚀起漲點確認(整理後放量突破+${pattern.patterns.join('/')})` : null,
  };
}

// 突破前波段高:今日收盤價 > 過去60個交易日(不含今日)最高價
function computeSwingHighBreakout(closes, highs, lookback = 60) {
  const n = closes.length;
  if (n < lookback + 1) return null;
  const priorHigh = Math.max(...highs.slice(n - 1 - lookback, n - 1));
  return { priorHigh: +priorHigh.toFixed(2), confirmed: closes[n - 1] > priorHigh };
}

// 飆股拉回均線:過去20日漲幅≥20%的強勢股,現價拉回接近MA5或MA10(±2%以內)
function computeSurgePullbackToMA(closes, ma5, ma10, lookback = 20, surgeThreshold = 20) {
  const n = closes.length;
  if (n < lookback + 1 || ma5 == null || ma10 == null) return null;
  const priorClose = closes[n - 1 - lookback];
  if (priorClose <= 0) return null;
  const surgePct = ((closes[n - 1] - priorClose) / priorClose) * 100;
  const isSurgeStock = surgePct >= surgeThreshold;
  const nearMA5 = Math.abs((closes[n - 1] - ma5) / ma5 * 100) <= 2;
  const nearMA10 = Math.abs((closes[n - 1] - ma10) / ma10 * 100) <= 2;
  const pullbackToMA = nearMA5 || nearMA10;
  const maTouched = nearMA5 ? 'MA5' : (nearMA10 ? 'MA10' : null);
  return { surgePct: +surgePct.toFixed(1), isSurgeStock, pullbackToMA, maTouched, confirmed: isSurgeStock && pullbackToMA };
}

// 均線糾結:MA5/MA10/MA20三條線彼此差距在3%以內
function computeMAEntanglement(ma5, ma10, ma20, threshold = 3) {
  if (ma5 == null || ma10 == null || ma20 == null) return null;
  const vals = [ma5, ma10, ma20];
  const maxV = Math.max(...vals);
  const minV = Math.min(...vals);
  if (minV <= 0) return null;
  const spreadPct = ((maxV - minV) / minV) * 100;
  return { spreadPct: +spreadPct.toFixed(2), confirmed: spreadPct <= threshold };
}

// 投信首購:過去20次紀錄(本機瀏覽器localStorage累積,與每日報表的本機CSV性質相同)內都沒有買超,今天由賣轉買
function getTrustFirstBuy(code, lookback = 20) {
  try {
    const all = JSON.parse(localStorage.getItem('tw_stock_flow_history') || '[]');
    const rows = all.filter((r) => r.code === code).sort((a, b) => b.date.localeCompare(a.date));
    if (rows.length === 0) return null;
    const todayVal = rows[0].trustNet;
    if (todayVal == null || todayVal <= 0) return { confirmed: false };
    const priorRows = rows.slice(1, 1 + lookback);
    if (priorRows.length < lookback) return null; // 本機累積天數不足,無法判斷,不編造結果
    const hadPriorBuy = priorRows.some((r) => r.trustNet > 0);
    return { confirmed: !hadPriorBuy, checkedDays: priorRows.length };
  } catch (e) {
    return null;
  }
}

function computeRSI(closes, period = 14) {
  const n = closes.length;
  if (n < period + 1) return null;
  const gains = [], losses = [];
  for (let i = 1; i < n; i++) {
    const diff = closes[i] - closes[i - 1];
    gains.push(diff > 0 ? diff : 0);
    losses.push(diff < 0 ? -diff : 0);
  }
  let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
  let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < gains.length; i++) {
    avgGain = (avgGain * (period - 1) + gains[i]) / period;
    avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
  }
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return +(100 - 100 / (1 + rs)).toFixed(1);
}

function ema(values, period) {
  if (values.length < period) return null;
  const k = 2 / (period + 1);
  let e = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < values.length; i++) e = values[i] * k + e * (1 - k);
  return e;
}

function computeMACD(closes) {
  if (closes.length < 35) return null;
  const series = [];
  for (let i = 26; i <= closes.length; i++) {
    const slice = closes.slice(0, i);
    const e12 = ema(slice, 12), e26 = ema(slice, 26);
    if (e12 != null && e26 != null) series.push(e12 - e26);
  }
  if (series.length < 9) return null;
  const signal = ema(series, 9);
  const macd = series[series.length - 1];
  const cross = macd > signal ? 'MACD在訊號線上方(偏多)' : 'MACD在訊號線下方(偏空)';
  return { macd: +macd.toFixed(2), signal: +signal.toFixed(2), hist: +(macd - signal).toFixed(2), crossText: cross };
}

function computeATR(closes, highs, lows, period = 14) {
  const n = closes.length;
  if (n < period + 1) return null;
  const trs = [];
  for (let i = 1; i < n; i++) {
    const tr = Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1]));
    trs.push(tr);
  }
  return trs.slice(-period).reduce((a, b) => a + b, 0) / period;
}

function computeBias(lastPrice, ma20) {
  if (!ma20) return null;
  const bias = +(((lastPrice - ma20) / ma20) * 100).toFixed(2);
  let warning = '';
  if (bias > 15) warning = '⚠️追高風險高(乖離過大)';
  else if (bias > 8) warning = '短線漲多,留意拉回';
  else if (bias >= -5 && bias < 5) warning = '相對安全,乖離不大';
  return { bias, warning };
}

function computeUpDays(closes, lookback = 5) {
  if (closes.length < lookback + 1) return null;
  let upDays = 0;
  for (let i = closes.length - lookback; i < closes.length; i++) {
    if (closes[i] > closes[i - 1]) upDays++;
  }
  let label = `近5日漲${upDays}天`;
  if (upDays >= 4) label += '(已連漲多日,追高風險較高)';
  else if (upDays <= 1) label += '(可能為打底後首次突破)';
  return { upDays, label };
}

function computeVolTrend(volumes) {
  if (!volumes || volumes.length < 20) return '資料不足';
  const recent = volumes.slice(-5).reduce((a, b) => a + b, 0) / 5;
  const prior = volumes.slice(-20, -5).reduce((a, b) => a + b, 0) / 15;
  if (prior <= 0) return '資料不足';
  if (recent > prior * 1.2) return '近期量增';
  if (recent < prior * 0.8) return '近期量縮';
  return '量能持平';
}

function computeVolumeRatio(volumes) {
  if (!volumes || volumes.length < 6) return null;
  const today = volumes[volumes.length - 1];
  const avg5 = volumes.slice(-6, -1).reduce((a, b) => a + b, 0) / 5;
  if (avg5 <= 0) return null;
  return +(today / avg5).toFixed(2);
}

function computeVolumeDivergence(dayChangePct, volTrend) {
  if (dayChangePct == null || !volTrend) return null;
  if (dayChangePct > 0 && volTrend === '近期量縮') return { text: '⚠️價漲量縮,上漲力道存疑,留意是否為假突破', color: COLORS.orange };
  if (dayChangePct < 0 && volTrend === '近期量增') return { text: '⚠️價跌量增,賣壓沉重', color: COLORS.orange };
  if (dayChangePct > 0 && volTrend === '近期量增') return { text: '價漲量增,買盤積極,訊號品質較佳', color: COLORS.up };
  return null;
}

function computeCrossInfo(closes) {
  if (closes.length < 21) return null;
  const last4 = closes.slice(-4);
  const sum4 = last4.reduce((a, b) => a + b, 0);
  const last19 = closes.slice(-19);
  const sum19 = last19.reduce((a, b) => a + b, 0);
  const crossPrice = +((5 * sum19 - 20 * sum4) / 15).toFixed(2);

  const closesYesterday = closes.slice(0, -1);
  const ma5Y = sma(closesYesterday, 5);
  const ma20Y = sma(closesYesterday, 20);
  const ma5 = sma(closes, 5);
  const ma20 = sma(closes, 20);
  if (ma5 == null || ma20 == null) return null;

  let direction = '資料不足';
  if (ma5Y != null && ma20Y != null) {
    const spreadToday = ma5 - ma20;
    const spreadYesterday = ma5Y - ma20Y;
    if (spreadToday > spreadYesterday) direction = '往上發展(遠離死亡交叉/偏多增強)';
    else if (spreadToday < spreadYesterday) direction = '往下發展(逼近死亡交叉/偏空增強)';
    else direction = '持平';
  }

  const statusText = ma5 > ma20
    ? `黃金排列(MA5在上),跌破 ${crossPrice} 元將觸發死亡交叉`
    : `死亡排列(MA5在下),站上 ${crossPrice} 元將觸發黃金交叉`;

  return { crossPrice, direction, statusText };
}

// 交易成本試算:官方公告標準費率(未打折)——手續費買賣各收0.1425%,證交稅一般0.3%/當沖0.15%(優惠現行至2027年底)
function computeTradingCost() {
  const feeRate = 0.001425;
  const dayTradeTax = 0.0015;
  const normalTax = 0.003;
  return {
    dayTrade: +((feeRate * 2 + dayTradeTax) * 100).toFixed(2),
    normal: +((feeRate * 2 + normalTax) * 100).toFixed(2),
  };
}

function computeStopLoss(closes, highs, lows, lastPrice) {
  if (closes.length < 21) return null;
  const ma20 = sma(closes, 20);
  const recentLow20 = Math.min(...lows.slice(-20));
  const atr = computeATR(closes, highs, lows, 14);
  const atrStop = atr ? +(lastPrice - 2 * atr).toFixed(2) : null;

  const levels = [];
  if (ma20) levels.push({ label: 'MA20月線', value: +ma20.toFixed(2) });
  if (recentLow20) levels.push({ label: '近20日低點', value: +recentLow20.toFixed(2) });
  if (atrStop) levels.push({ label: '2倍ATR波動停損', value: atrStop });
  if (levels.length === 0) return null;

  const below = levels.filter(l => l.value < lastPrice).sort((a, b) => b.value - a.value);
  const primary = below.length ? below[0] : [...levels].sort((a, b) => a.value - b.value)[0];
  const detailText = levels.map(l => `${l.label}:${l.value}`).join('、');
  const lossPct = +(((lastPrice - primary.value) / lastPrice) * 100).toFixed(2);

  return { price: primary.value, basis: primary.label, lossPct, detailText };
}

// VWAP(成交量加權平均價):跟每日報表同一套邏輯,近20日高低收均價依成交量加權
function computeVWAP(closes, highs, lows, volumes, period = 20) {
  if (closes.length < period || !volumes || volumes.length < period) return null;
  const c = closes.slice(-period), h = highs.slice(-period), l = lows.slice(-period), v = volumes.slice(-period);
  let sumPV = 0, sumV = 0;
  for (let i = 0; i < period; i++) {
    const typicalPrice = (h[i] + l[i] + c[i]) / 3;
    sumPV += typicalPrice * v[i];
    sumV += v[i];
  }
  if (sumV <= 0) return null;
  const vwap = +(sumPV / sumV).toFixed(2);
  const lastClose = closes[closes.length - 1];
  const diffPct = +(((lastClose - vwap) / vwap) * 100).toFixed(2);
  const posText = lastClose >= vwap ? `高於VWAP(站上近${period}日平均成交成本)` : `低於VWAP(跌破近${period}日平均成交成本)`;
  return { vwap, diffPct, posText };
}

// 布林通道:跟每日報表同一套邏輯,20日均線±2倍標準差
function computeBollingerBands(closes, period = 20, stdDevMultiplier = 2) {
  if (closes.length < period) return null;
  const slice = closes.slice(-period);
  const mean = slice.reduce((a, b) => a + b, 0) / period;
  const variance = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
  const stdDev = Math.sqrt(variance);
  const upper = +(mean + stdDevMultiplier * stdDev).toFixed(2);
  const lower = +(mean - stdDevMultiplier * stdDev).toFixed(2);
  const mid = +mean.toFixed(2);
  const lastClose = closes[closes.length - 1];
  const bandWidthPct = mid > 0 ? +(((upper - lower) / mid) * 100).toFixed(1) : null;
  let squeezeText;
  if (bandWidthPct != null && bandWidthPct <= 10) squeezeText = `通道壓縮中(寬度僅${bandWidthPct}%,波動度偏低,留意變盤)`;
  else if (bandWidthPct != null && bandWidthPct >= 30) squeezeText = `通道明顯擴張(寬度${bandWidthPct}%,波動度偏高)`;
  else squeezeText = `通道寬度${bandWidthPct}%,波動度中等`;
  let posText;
  if (lastClose >= upper) posText = '觸及或突破上軌(短線強勢,但也可能過熱)';
  else if (lastClose <= lower) posText = '觸及或跌破下軌(短線弱勢,但也可能超跌)';
  else posText = '位於通道中間區域';
  return { upper, mid, lower, bandWidthPct, squeezeText, posText };
}

// 週線趨勢確認:把日K聚合成週K(每5個交易日一根),跟每日報表同一套邏輯,避免逆週線大趨勢操作
function computeWeeklyTrend(closes, weeksNeeded = 22) {
  const daysNeeded = weeksNeeded * 5;
  if (closes.length < daysNeeded) return null;
  const weeklyCloses = [];
  const n = closes.length;
  const startIdx = n % 5;
  for (let i = startIdx; i <= n - 5; i += 5) {
    weeklyCloses.push(closes[i + 4]);
  }
  if (weeklyCloses.length < 20) return null;
  const wMA5 = sma(weeklyCloses, 5);
  const wMA20 = sma(weeklyCloses, 20);
  if (wMA5 == null || wMA20 == null) return null;
  const trend = wMA5 > wMA20 ? '週線偏多' : '週線偏空';
  return { weeklyMA5: +wMA5.toFixed(2), weeklyMA20: +wMA20.toFixed(2), trend };
}

// 當沖成交值排名:跟每日報表同一套邏輯,依全市場成交值排名,前20顯示名次,其餘顯示實際成交值,處置股標註不能當沖
function computeDayTradeInfo(code, snapshot, dispositionInfo) {
  if (dispositionInfo) {
    return { text: '不能當沖(處置股期間中,依現有資料判斷,僅能捕捉部分限制情況,實際是否可當沖請以官方公告為準)', isDisposition: true };
  }
  if (!snapshot || !Array.isArray(snapshot)) return null;
  const ranked = snapshot
    .map((row) => ({ code: row['證券代號'], tradeValue: parseFloat(row['成交金額']) || 0 }))
    .filter((r) => r.tradeValue > 0)
    .sort((a, b) => b.tradeValue - a.tradeValue);
  const idx = ranked.findIndex((r) => r.code === code);
  if (idx === -1) return null;
  const rank = idx + 1;
  if (rank <= 20) return { text: `當沖成交值排名:全市場第${rank}名`, rank };
  const tradeValue = ranked[idx].tradeValue;
  return { text: `當沖成交值:${(tradeValue / 100000000).toFixed(2)}億元`, tradeValue };
}

function computeTomorrowOutlook(ma5, ma20, kd, closes) {
  if (ma5 == null || ma20 == null || !kd) return null;
  const recentK = kd.recentK || [];
  let kMomentum = '持平';
  if (recentK.length >= 3) {
    if (recentK[2] > recentK[1] && recentK[1] > recentK[0]) kMomentum = '增強';
    else if (recentK[2] < recentK[1] && recentK[1] < recentK[0]) kMomentum = '減弱';
  }
  let priceMomentum = '持平';
  if (closes.length >= 4) {
    const diffs = [];
    for (let j = closes.length - 3; j < closes.length; j++) diffs.push(closes[j] - closes[j - 1]);
    const avgDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    if (avgDiff > 0) priceMomentum = '上升';
    else if (avgDiff < 0) priceMomentum = '下降';
  }
  let score = 0;
  score += ma5 > ma20 ? 1 : -1;
  score += kd.K > kd.D ? 1 : -1;
  if (kMomentum === '增強') score++; else if (kMomentum === '減弱') score--;
  if (priceMomentum === '上升') score++; else if (priceMomentum === '下降') score--;

  const outlook = score >= 2 ? '偏多機率較高' : score <= -2 ? '偏空機率較高' : '方向不明,建議觀望';
  return `明日推測:${outlook}(KD動能:${kMomentum},短期價格動能:${priceMomentum})※僅為技術指標簡單推算,非保證,僅供參考`;
}

// 還原股價:用「調整後收盤價/原始收盤價」的比例,同比例套用到當日High/Low,
// 修正除權息造成的價格跳空,避免技術指標(KD/RSI/MACD/均線)在除權息日附近出現不代表真實漲跌的假訊號。
// 若沒有adjCloses資料(例如舊快取或抓取失敗),則直接退回原始價格,不影響原本功能。
function getAdjustedSeries(closes, highs, lows, adjCloses, opens) {
  if (!adjCloses || adjCloses.length !== closes.length) {
    return { closes, highs, lows, opens };
  }
  const adjC = [], adjH = [], adjL = [], adjO = [];
  for (let i = 0; i < closes.length; i++) {
    const c = closes[i];
    const ac = (adjCloses[i] != null && c) ? adjCloses[i] : c;
    const factor = c ? ac / c : 1;
    adjC.push(ac);
    adjH.push(highs[i] * factor);
    adjL.push(lows[i] * factor);
    adjO.push(opens ? opens[i] * factor : null);
  }
  return { closes: adjC, highs: adjH, lows: adjL, opens: adjO };
}

function analyze(closes, highs, lows, volumes, adjCloses, opens, code) {
  const n = closes.length;
  const last = closes[n - 1]; // 現價一律顯示原始成交價,不用還原價(兩者在最新一天理論上相等)
  const prev = closes[n - 2];
  const dayChangePct = prev ? ((last - prev) / prev) * 100 : null;

  // 技術指標計算改用還原股價序列,避免除權息造成的假跳空誤判
  const adj = getAdjustedSeries(closes, highs, lows, adjCloses, opens);
  const ma5 = sma(adj.closes, 5);
  const ma10 = sma(adj.closes, 10);
  const ma20 = sma(adj.closes, 20);
  const kd = computeKD(adj.closes, adj.highs, adj.lows, 9);
  const rsi = computeRSI(adj.closes, 14);
  const macd = computeMACD(adj.closes);
  const biasInfo = computeBias(last, ma20);
  const upDaysInfo = computeUpDays(adj.closes, 5);
  const volTrend = computeVolTrend(volumes);
  const volRatio = computeVolumeRatio(volumes);
  const volumeDivergence = computeVolumeDivergence(dayChangePct, volTrend);
  const crossInfo = computeCrossInfo(adj.closes);
  const stopLoss = computeStopLoss(adj.closes, adj.highs, adj.lows, last);
  const tomorrowOutlook = computeTomorrowOutlook(ma5, ma20, kd, adj.closes);
  const rallySignal = computeRallyStartSignal(adj.opens, adj.highs, adj.lows, adj.closes, volumes);
  const swingHighBreakout = computeSwingHighBreakout(adj.closes, adj.highs);
  const surgePullback = computeSurgePullbackToMA(adj.closes, ma5, ma10);
  const maEntanglement = computeMAEntanglement(ma5, ma10, ma20);
  const trustFirstBuy = code ? getTrustFirstBuy(code) : null;
  const vwapInfo = computeVWAP(adj.closes, adj.highs, adj.lows, volumes);
  const bollingerInfo = computeBollingerBands(adj.closes);
  const weeklyTrendInfo = computeWeeklyTrend(adj.closes);

  // 「偏多/偏空」結論改為三重確認(均線排列+KD交叉+量能未萎縮),與每日報表PowerShell版本邏輯一致,
  // 理由:價漲量縮是常見假突破訊號,加入量能確認可過濾掉一部分雜訊。量能資料不足時退回雙重確認。
  let conclusion = '資料不足', score = 0;
  if (ma5 != null && ma20 != null && kd) {
    let bull = 0;
    let requiredFactors = 2;
    if (ma5 > ma20) bull++;
    if (kd.K > kd.D) bull++;
    if (volTrend !== '資料不足') {
      requiredFactors = 3;
      if (volTrend !== '近期量縮') bull++;
    }
    conclusion = bull === requiredFactors ? '偏多 ↑' : bull === 0 ? '偏空 ↓' : '中性/觀望 →';
    score = bull === requiredFactors ? 1 : bull === 0 ? -1 : 0;
  }

  const todayVolZhang = volumes && volumes.length ? Math.round(volumes[volumes.length - 1] / 1000) : null;

  // 即將觸發提醒:現價與均線交叉價或建議停損價距離小於2%時提醒
  let triggerAlert = null;
  if (crossInfo && crossInfo.crossPrice) {
    const dist = Math.abs((last - crossInfo.crossPrice) / last) * 100;
    if (dist < 2) triggerAlert = `⚠️即將觸發:現價距離均線交叉價 ${crossInfo.crossPrice} 僅 ${dist.toFixed(2)}%(${crossInfo.statusText})`;
  }
  if (!triggerAlert && stopLoss) {
    const dist2 = Math.abs((last - stopLoss.price) / last) * 100;
    if (dist2 < 2) triggerAlert = `⚠️即將觸發:現價距離建議停損價 ${stopLoss.price} 僅 ${dist2.toFixed(2)}%`;
  }

  const tradingCost = computeTradingCost();

  return {
    last: +last.toFixed(2), dayChangePct, ma5, ma10, ma20, kd, rsi, macd, biasInfo, upDaysInfo,
    volTrend, volRatio, volumeDivergence, crossInfo, stopLoss, tomorrowOutlook,
    conclusion, score, todayVolZhang, triggerAlert, tradingCost, rallySignal,
    swingHighBreakout, surgePullback, maEntanglement, trustFirstBuy,
    vwapInfo, bollingerInfo, weeklyTrendInfo,
  };
}

// 判斷現在是否為台股交易時段(週一~週五 09:00-13:30,以台北時區為準)
function isTradingWindow() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Taipei', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(now);
  const weekday = parts.find(p => p.type === 'weekday').value; // Mon, Tue, ... Sun
  const hh = +parts.find(p => p.type === 'hour').value;
  const mm = +parts.find(p => p.type === 'minute').value;
  const isWeekday = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(weekday);
  const minutes = hh * 60 + mm;
  const isTradingTime = minutes >= 9 * 60 && minutes <= 13 * 60 + 30;
  return isWeekday && isTradingTime;
}

function recordFlowHistory(code, flow) {
  if (!flow) return;
  try {
    const key = 'tw_stock_flow_history';
    const all = JSON.parse(localStorage.getItem(key) || '[]');
    const today = getTaipeiDateStr();
    // 若今天已經記錄過這檔股票,不重複記錄(避免同一天查詢多次造成資料失真)
    if (all.some((r) => r.code === code && r.date === today)) return;
    all.push({ date: today, code, ...flow });
    // 只保留最近90筆同一檔股票的記錄,避免localStorage無限增長
    const trimmed = all.filter((r) => r.code !== code).concat(
      all.filter((r) => r.code === code).slice(-90)
    );
    localStorage.setItem(key, JSON.stringify(trimmed));
  } catch (e) { /* ignore */ }
}

function getConsecutiveDays(code, field) {
  try {
    const all = JSON.parse(localStorage.getItem('tw_stock_flow_history') || '[]');
    const rows = all.filter((r) => r.code === code).sort((a, b) => b.date.localeCompare(a.date));
    if (rows.length === 0) return null;
    const first = rows[0][field];
    if (first === 0 || first == null) return { days: 0, direction: '持平' };
    const direction = first > 0 ? '買超' : '賣超';
    let count = 0;
    for (const r of rows) {
      const v = r[field];
      if ((direction === '買超' && v > 0) || (direction === '賣超' && v < 0)) count++;
      else break;
    }
    return { days: count, direction };
  } catch (e) {
    return null;
  }
}

function checkAISignalConsistency(aiSentiment, quantConclusion) {
  if (!aiSentiment || !quantConclusion) return null;
  const quantDir = quantConclusion.includes('偏多') ? '偏多' : quantConclusion.includes('偏空') ? '偏空' : '中性';
  const aiDir = aiSentiment.includes('偏多') ? '偏多' : aiSentiment.includes('偏空') ? '偏空' : '中性';
  if (quantDir === '中性' || aiDir === '中性') return null;
  if (quantDir !== aiDir) return `⚠️AI文字分析語氣(${aiDir})與量化技術面結論(${quantDir})方向不一致,建議進一步確認後再參考`;
  return null;
}

// 將使用者輸入解析成股票代號:純數字/數字+字母視為代號直接使用;否則嘗試用中文名稱比對(優先完全符合,其次部分符合)
function resolveStockCode(input, nameMap) {
  if (/^[0-9]{4,6}[A-Za-z]?$/.test(input)) return input;
  if (!nameMap) return input;
  const exactEntry = Object.entries(nameMap).find(([, name]) => name === input);
  if (exactEntry) return exactEntry[0];
  const partialEntry = Object.entries(nameMap).find(([, name]) => name.includes(input));
  if (partialEntry) return partialEntry[0];
  return input;
}

function DailyChart({ opens, highs, lows, closes, volumes, timestamps, name, code }) {
  const priceBoxRef = React.useRef(null);
  const volBoxRef = React.useRef(null);
  const rsiBoxRef = React.useRef(null);

  React.useEffect(() => {
    if (!opens || opens.length < 20 || !priceBoxRef.current) return;

    // 將秒級timestamp轉為Lightweight Charts要求的 'yyyy-MM-dd' 字串(以台北時區判斷日期)
    const toDateStr = (t) => {
      const d = new Date(t * 1000);
      return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei' }).format(d); // sv-SE格式剛好是yyyy-MM-dd
    };

    const r2 = (v) => v == null ? v : +v.toFixed(2);
    const candleData = opens.map((o, i) => ({
      time: toDateStr(timestamps[i]), open: r2(o), high: r2(highs[i]), low: r2(lows[i]), close: r2(closes[i]),
    }));
    const volumeData = volumes.map((v, i) => ({
      time: toDateStr(timestamps[i]), value: v,
      color: closes[i] >= opens[i] ? 'rgba(255,82,82,0.6)' : 'rgba(46,204,113,0.6)',
    }));

    const smaLine = (period) => {
      const out = [];
      for (let i = period - 1; i < closes.length; i++) {
        const avg = closes.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
        out.push({ time: toDateStr(timestamps[i]), value: +avg.toFixed(2) });
      }
      return out;
    };
    const rsiLine = (() => {
      const out = [];
      const period = 14;
      if (closes.length < period + 1) return out;
      const gains = [], losses = [];
      for (let i = 1; i < closes.length; i++) {
        const diff = closes[i] - closes[i - 1];
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? -diff : 0);
      }
      let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
      let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < gains.length; i++) {
        avgGain = (avgGain * (period - 1) + gains[i]) / period;
        avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
        const rsi = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
        out.push({ time: toDateStr(timestamps[i + 1]), value: +rsi.toFixed(1) });
      }
      return out;
    })();

    const commonOpts = {
      layout: { background: { color: COLORS.card }, textColor: COLORS.textSecondary, fontFamily: "'JetBrains Mono', monospace" },
      grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
      timeScale: { borderColor: COLORS.border, timeVisible: false },
      rightPriceScale: { borderColor: COLORS.border },
      crosshair: { mode: 0 },
      handleScroll: false, handleScale: false,
    };

    priceBoxRef.current.innerHTML = '';
    const priceChart = LightweightCharts.createChart(priceBoxRef.current, {
      ...commonOpts, height: 220,
      rightPriceScale: { borderColor: COLORS.border, entireTextOnly: true },
    });
    const candleSeries = priceChart.addCandlestickSeries({
      upColor: COLORS.up, downColor: COLORS.down, borderVisible: false,
      wickUpColor: COLORS.up, wickDownColor: COLORS.down,
      priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
    });
    candleSeries.setData(candleData);
    const ma5Series = priceChart.addLineSeries({ color: COLORS.gold, lineWidth: 1, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } });
    ma5Series.setData(smaLine(5));
    const ma20Series = priceChart.addLineSeries({ color: '#7fa8ff', lineWidth: 1, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } });
    ma20Series.setData(smaLine(20));
    priceChart.timeScale().fitContent();

    volBoxRef.current.innerHTML = '';
    const volChart = LightweightCharts.createChart(volBoxRef.current, { ...commonOpts, height: 80 });
    const volSeries = volChart.addHistogramSeries({ priceFormat: { type: 'volume' } });
    volSeries.setData(volumeData);
    volChart.timeScale().fitContent();

    rsiBoxRef.current.innerHTML = '';
    const rsiChart = LightweightCharts.createChart(rsiBoxRef.current, { ...commonOpts, height: 90 });
    const rsiSeries = rsiChart.addLineSeries({ color: '#c77dff', lineWidth: 2, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } });
    rsiSeries.setData(rsiLine);
    const upperBand = rsiChart.addLineSeries({ color: 'rgba(255,82,82,0.4)', lineWidth: 1, lineStyle: 2, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } });
    upperBand.setData(rsiLine.map(p => ({ time: p.time, value: 70 })));
    const lowerBand = rsiChart.addLineSeries({ color: 'rgba(46,204,113,0.4)', lineWidth: 1, lineStyle: 2, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } });
    lowerBand.setData(rsiLine.map(p => ({ time: p.time, value: 30 })));
    rsiChart.timeScale().fitContent();

    // 三個圖表的水平捲動/縮放同步
    const charts = [priceChart, volChart, rsiChart];
    charts.forEach((c, idx) => {
      c.timeScale().subscribeVisibleLogicalRangeChange((range) => {
        if (!range) return;
        charts.forEach((other, j) => { if (j !== idx) other.timeScale().setVisibleLogicalRange(range); });
      });
    });

    return () => { charts.forEach(c => c.remove()); };
  }, [opens, highs, lows, closes, volumes, timestamps]);

  return (
    <div style={{ marginTop: 6 }}>
      <div style={{ fontSize: 12, color: COLORS.textSecondary, marginBottom: 4 }}>日K線(近3個月)· MA5(金) / MA20(藍)</div>

}

function Gauge({ score, conclusion }) {
  const angle = score === 1 ? 45 : score === -1 ? -45 : 0;
  const color = score === 1 ? COLORS.up : score === -1 ? COLORS.down : COLORS.textSecondary;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '8px 0 4px' }}>
      <svg width="160" height="90" viewBox="0 0 160 90">
        <path d="M 15 80 A 65 65 0 0 1 145 80" fill="none" stroke={COLORS.border} strokeWidth="10" strokeLinecap="round" />
        <path
          d={score === 1 ? "M 80 80 A 65 65 0 0 1 145 80" : score === -1 ? "M 15 80 A 65 65 0 0 1 80 80" : "M 70 80 A 65 65 0 0 1 90 80"}
          fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
        />
        <g transform={`translate(80,80) rotate(${angle})`}>
          <line x1="0" y1="0" x2="0" y2="-55" stroke={COLORS.gold} strokeWidth="3" strokeLinecap="round" />
        </g>
        <circle cx="80" cy="80" r="6" fill={COLORS.gold} />
      </svg>
      <div style={{ fontFamily: "'Noto Serif TC', serif", fontSize: 22, fontWeight: 700, color, marginTop: -6 }}>{conclusion}</div>
    </div>
  );
}

function StatBox({ label, value, sub, color }) {

      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 17, fontWeight: 700, color: color || COLORS.textPrimary }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: COLORS.textSecondary, marginTop: 2 }}>{sub}</div>}

function InfoLine({ label, children, color }) {

    <div style={{ marginTop: 10, fontSize: 14, lineHeight: 1.8, color: color || COLORS.textPrimary }}>
      {label && <span style={{ color: COLORS.textSecondary, fontWeight: 600 }}>{label}:</span>} {children}

  );
}

function StockAnalyzer() {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [watchlist, setWatchlist] = useState([]);
  const [updatedAt, setUpdatedAt] = useState(null);
  const [now, setNow] = useState(new Date());
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [guestCount, setGuestCount] = useState(0);
  const [showLogs, setShowLogs] = useState(false);
  const [adminLogs, setAdminLogs] = useState(null);
  const [logsLoading, setLogsLoading] = useState(false);
  const [question, setQuestion] = useState('');
  const [askLoading, setAskLoading] = useState(false);
  const [askAnswer, setAskAnswer] = useState(null);
  const [aiInsight, setAiInsight] = useState(null);
  const [insightLoading, setInsightLoading] = useState(false);
  const [insightDebug, setInsightDebug] = useState(null);
  const [compareMode, setCompareMode] = useState(false);
  const [compareInput, setCompareInput] = useState('');
  const [compareResults, setCompareResults] = useState(null);
  const [compareLoading, setCompareLoading] = useState(false);
  const nameMapRef = useRef(null);

  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    try {
      if (localStorage.getItem('tw_stock_logged_in') === 'true') setIsLoggedIn(true);
      setGuestCount(getGuestCountToday());
    } catch (e) { /* ignore */ }
  }, []);

  const loadAdminLogs = async () => {
    setLogsLoading(true);
    const data = await fetchAdminLogs();
    setLogsLoading(false);
    setAdminLogs(data);
  };

  const handleLogin = () => {
    setIsLoggedIn(true);
    try { localStorage.setItem('tw_stock_logged_in', 'true'); } catch (e) { /* ignore */ }
  };
  const handleLogout = () => {
    setIsLoggedIn(false);
    try { localStorage.setItem('tw_stock_logged_in', 'false'); } catch (e) { /* ignore */ }
  };

  useEffect(() => {
    try {
      const saved = localStorage.getItem('tw_stock_watchlist');
      if (saved) setWatchlist(JSON.parse(saved));
    } catch (e) { /* no watchlist yet */ }
    fetchTwseNameMap().then(map => { if (map) nameMapRef.current = map; });
  }, []);

  const saveWatchlist = useCallback((list) => {
    setWatchlist(list);
    try { localStorage.setItem('tw_stock_watchlist', JSON.stringify(list)); } catch (e) { /* ignore */ }
  }, []);

  const runAnalysis = useCallback(async (rawInput) => {
    const trimmedInput = rawInput.trim();
    if (!trimmedInput) { setError('請輸入股票代號或中文名稱'); return; }
    const cleaned = resolveStockCode(trimmedInput, nameMapRef.current);

    if (!isLoggedIn && isTradingWindow()) {
      const currentCount = getGuestCountToday();
      if (currentCount >= GUEST_SEARCH_LIMIT) {
        setError(`交易時段(週一~週五09:00-13:30)訪客搜尋次數已達上限(${GUEST_SEARCH_LIMIT}次),交易時段結束後或明日開盤前不受限制,或請登入解鎖無限次查詢`);
        return;
      }
    }
    setLoading(true); setError(null); setResult(null);

    const [data, marginChange, dividend, disposition, flow, announcements, revenue, profitability, twseSnapshot] = await Promise.all([
      fetchStock(cleaned), fetchMargin(cleaned), fetchDividend(cleaned), fetchDisposition(cleaned), fetchInstitutional(cleaned), fetchAnnouncements(cleaned), fetchRevenue(cleaned), fetchProfitability(cleaned), fetchTwseSnapshot(),
    ]);
    setLoading(false);
    if (!data) { setError(`查無「${trimmedInput}」的資料,請確認代號或名稱是否正確(中文名稱搜尋目前僅涵蓋上市股票)`); return; }

    const dayTradeInfo = computeDayTradeInfo(data.code, twseSnapshot, disposition);

    recordFlowHistory(cleaned, flow);
    const foreignStreak = getConsecutiveDays(cleaned, 'foreignNet');
    const trustStreak = getConsecutiveDays(cleaned, 'trustNet');
    const dealerStreak = getConsecutiveDays(cleaned, 'dealerNet');

    const analysis = analyze(data.closes, data.highs, data.lows, data.volumes, data.adjCloses, data.opens, data.code);
    // 中文名稱查詢:優先用上市快照,查不到再嘗試上櫃備援查詢(與報表系統邏輯一致)
    let chineseName = nameMapRef.current && nameMapRef.current[data.code];
    if (!chineseName) chineseName = await fetchOtcName(cleaned);
    if (!chineseName) chineseName = data.name;
    const news = await fetchNews(cleaned, chineseName);
    const fullResult = { ...data, name: chineseName, ...analysis, marginChange, dividend, disposition, flow, foreignStreak, trustStreak, dealerStreak, announcements, revenue, profitability, news, dayTradeInfo };
    setResult(fullResult);
    setUpdatedAt(new Date());
    logSearch(cleaned, !isLoggedIn);

    if (!isLoggedIn && isTradingWindow()) {
      try {
        const newCount = incrementGuestCount();
        setGuestCount(newCount);
      } catch (e) { /* ignore */ }
    }

    // 自動產生AI綜合分析(比照每日報表邏輯),並檢查與量化結論是否一致
    setInsightLoading(true);
    setAiInsight(null);
    setInsightDebug(null);
    const contextParts = [];
    contextParts.push(`股票:${fullResult.code} ${fullResult.name}(${fullResult.market})`);
    contextParts.push(`現價:${fullResult.last},今日漲跌:${fullResult.dayChangePct != null ? fullResult.dayChangePct.toFixed(2) + '%' : '無資料'}`);
    contextParts.push(`綜合判斷:${fullResult.conclusion}`);
    if (fullResult.ma5 && fullResult.ma20) contextParts.push(`MA5=${fullResult.ma5.toFixed(2)}, MA20=${fullResult.ma20.toFixed(2)}`);
    if (fullResult.kd) contextParts.push(`KD: K=${fullResult.kd.K}, D=${fullResult.kd.D}`);
    if (fullResult.rsi != null) contextParts.push(`RSI(14)=${fullResult.rsi}`);
    if (fullResult.macd) contextParts.push(`MACD柱狀圖=${fullResult.macd.hist}(${fullResult.macd.crossText})`);
    if (fullResult.biasInfo) contextParts.push(`乖離率=${fullResult.biasInfo.bias}%`);
    if (fullResult.volRatio != null) contextParts.push(`量比=${fullResult.volRatio}倍`);
    if (revenue) contextParts.push(`月營收年增${revenue.yoy}%、月增${revenue.mom}%、產業別:${revenue.industry}`);
    if (profitability) {
      const epsText = profitability.eps != null ? `、本年累計EPS ${profitability.eps}元` : '';
      contextParts.push(`毛利率${profitability.grossMargin}%、營益率${profitability.operatingMargin}%${epsText}`);
    }
    if (flow) contextParts.push(`三大法人今日:外資${flow.foreignNet >= 0 ? '買超' : '賣超'}、投信${flow.trustNet >= 0 ? '買超' : '賣超'}`);
    if (announcements && announcements.length > 0) contextParts.push(`近期重大訊息:${announcements[0].subject}${announcements[0].sentiment ? `(AI判讀:${announcements[0].sentiment})` : ''}`);
    if (news && news.length > 0) contextParts.push(`近期相關新聞標題:` + news.map(n => `[${n.date}]${n.title}(${n.source || ''})`).join('; '));
    const insightResult = await fetchInsight(contextParts.join('\n'));
    setInsightLoading(false);
    if (insightResult && insightResult.insight) {
      setAiInsight(insightResult.insight);
    } else {
      setInsightDebug(insightResult ? insightResult.debug : null);
    }
  }, [isLoggedIn]);

  const addToWatchlist = () => {
    if (!isLoggedIn) { setError('追蹤功能僅限登入會員使用,請先登入'); return; }
    if (!result) return;
    if (watchlist.includes(result.code)) return;
    saveWatchlist([...watchlist, result.code]);
  };

  const buildContext = () => {
    if (!result) return '';
    const parts = [];
    parts.push(`股票:${result.code} ${result.name}(${result.market})`);
    parts.push(`現價:${result.last},今日漲跌:${result.dayChangePct != null ? result.dayChangePct.toFixed(2) + '%' : '無資料'}`);
    parts.push(`綜合判斷:${result.conclusion}`);
    if (result.ma5 && result.ma20) parts.push(`MA5=${result.ma5.toFixed(2)}, MA20=${result.ma20.toFixed(2)}`);
    if (result.kd) parts.push(`KD: K=${result.kd.K}, D=${result.kd.D}`);
    if (result.rsi != null) parts.push(`RSI(14)=${result.rsi}`);
    if (result.macd) parts.push(`MACD柱狀圖=${result.macd.hist}(${result.macd.crossText})`);
    if (result.biasInfo) parts.push(`乖離率=${result.biasInfo.bias}%(${result.biasInfo.warning || '正常'})`);
    if (result.volRatio != null) parts.push(`量比=${result.volRatio}倍`);
    if (result.stopLoss) parts.push(`建議停損價=${result.stopLoss.price}(依據:${result.stopLoss.basis})`);
    if (result.flow) parts.push(`三大法人今日:外資${result.flow.foreignNet >= 0 ? '買超' : '賣超'}、投信${result.flow.trustNet >= 0 ? '買超' : '賣超'}、自營商${result.flow.dealerNet >= 0 ? '買超' : '賣超'}`);
    const streakParts = [];
    if (result.foreignStreak?.days > 1) streakParts.push(`外資連${result.foreignStreak.days}日${result.foreignStreak.direction}`);
    if (result.trustStreak?.days > 1) streakParts.push(`投信連${result.trustStreak.days}日${result.trustStreak.direction}`);
    if (result.dealerStreak?.days > 1) streakParts.push(`自營商連${result.dealerStreak.days}日${result.dealerStreak.direction}`);
    if (streakParts.length > 0) parts.push(`連續買賣天數:${streakParts.join('、')}`);
    if (result.marginChange != null) parts.push(`散戶融資:${result.marginChange >= 0 ? '增加' : '減少'}`);
    if (result.disposition && result.disposition.period) parts.push(`⚠️注意:此股票目前為處置股,交易方式受限,處置期間${result.disposition.period}`);
    if (result.announcements && result.announcements.length > 0) {
      parts.push('近期重大訊息:' + result.announcements.slice(0, 3).map(a => `[${a.date}]${a.subject}${a.sentiment ? `(AI判讀:${a.sentiment})` : ''}`).join('; '));
    }
    return parts.join('\n');
  };

  const runCompare = async () => {
    const codes = compareInput.split(/[,、\s]+/).map(c => c.trim()).filter(Boolean).slice(0, 3);
    if (codes.length < 2) { setCompareResults({ error: '請至少輸入2檔股票代號(用逗號分隔),例如:2330,2454' }); return; }
    setCompareLoading(true);
    setCompareResults(null);

    const results = [];
    for (const code of codes) {
      const data = await fetchStock(code);
      if (!data) { results.push({ code, error: true }); continue; }
      const analysis = analyze(data.closes, data.highs, data.lows, data.volumes, data.adjCloses, data.opens, data.code);
      let chineseName = nameMapRef.current && nameMapRef.current[data.code];
      if (!chineseName) chineseName = await fetchOtcName(code);
      if (!chineseName) chineseName = data.name;
      results.push({ ...data, name: chineseName, ...analysis });
    }
    setCompareResults({ items: results });
    setCompareLoading(false);
  };

  const askQuestion = async () => {
    const q = question.trim();
    if (!q) { return; }
    if (!result) { setAskAnswer('請先查詢一檔股票,才能針對該股票提問'); return; }

    if (!isLoggedIn && isTradingWindow()) {
      const askCount = getGuestAskCountToday();
      if (askCount >= GUEST_ASK_LIMIT) {
        setAskAnswer(`交易時段訪客問AI次數已達上限(${GUEST_ASK_LIMIT}次),交易時段結束後或明日開盤前不受限制,或請登入解鎖無限次提問`);
        return;
      }
    }

    setAskLoading(true); setAskAnswer(null);
    try {
      const context = buildContext();
      const res = await fetch(`${PROXY_BASE}/api/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, context }),
      });
      const data = await res.json();
      setAskAnswer(data.answer || '無法取得回答');
      if (!isLoggedIn && isTradingWindow()) {
        try { incrementGuestAskCount(); } catch (e) { /* ignore */ }
      }
    } catch (e) {
      setAskAnswer('提問失敗,請稍後再試');
    }
    setAskLoading(false);
  };
  const removeFromWatchlist = (code) => {
    saveWatchlist(watchlist.filter(c => c !== code));
  };

  return (
    <div style={{ background: COLORS.bg, minHeight: '100vh', padding: '20px 16px 40px', fontFamily: "'Noto Sans TC', sans-serif", color: COLORS.textPrimary, position: 'relative' }}>
      <LoginBadge isLoggedIn={isLoggedIn} onLogin={handleLogin} onLogout={handleLogout} guestCount={guestCount}
        onShowLogs={() => { setShowLogs(!showLogs); if (!showLogs) loadAdminLogs(); }} />
      <div style={{ textAlign: 'center', marginBottom: 20 }}>
        <div style={{ fontFamily: "'Noto Serif TC', serif", fontSize: 22, fontWeight: 700, color: COLORS.gold, letterSpacing: 1 }}>台股即時分析</div>
        <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 2 }}>
          詹景淵(0910896935)製作
          <span style={{ color: '#ffffff', fontSize: 15, fontFamily: "'JetBrains Mono', monospace", marginLeft: 8 }}>
            {now.getFullYear()}/{String(now.getMonth() + 1).padStart(2, '0')}/{String(now.getDate()).padStart(2, '0')} {String(now.getHours()).padStart(2, '0')}:{String(now.getMinutes()).padStart(2, '0')}:{String(now.getSeconds()).padStart(2, '0')}
          </span>
        </div>
        <div style={{ color: COLORS.up, fontSize: 12, fontWeight: 700, marginTop: 4 }}>
          僅提供製作者本人使用,其他人投資風險概不負責!
        </div>
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        <button onClick={() => setCompareMode(false)} style={{
          background: !compareMode ? COLORS.gold : 'transparent', color: !compareMode ? '#1a1408' : COLORS.textMuted,
          border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: '4px 12px', fontSize: 12, cursor: 'pointer',
        }}>單股查詢</button>
        <button onClick={() => setCompareMode(true)} style={{
          background: compareMode ? COLORS.gold : 'transparent', color: compareMode ? '#1a1408' : COLORS.textMuted,
          border: `0.5px solid ${COLORS.border}`, borderRadius: 6, padding: '4px 12px', fontSize: 12, cursor: 'pointer',
        }}>多股比較</button>
      </div>

      {!compareMode && (
      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && runAnalysis(input)}
          placeholder="輸入股票代號或中文名稱,例如 2330 或 台積電"
          style={{
            flex: 1, background: COLORS.card, border: `0.5px solid ${COLORS.border}`, borderRadius: 8,
            padding: '6px 10px', color: COLORS.textPrimary, fontSize: 13, fontFamily: "'JetBrains Mono', monospace", outline: 'none',
          }}
        />
        <button
          onClick={() => runAnalysis(input)}
          style={{
            background: COLORS.gold, color: '#1a1408', border: 'none', borderRadius: 8,
            padding: '0 14px', fontSize: 13, fontWeight: 700, cursor: 'pointer',
          }}
        >查詢</button>
      </div>
      )}

      {compareMode && (
      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <input
            value={compareInput}
            onChange={e => setCompareInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && runCompare()}
            placeholder="輸入2-3檔股票代號,用逗號分隔,例如:2330,2454,2317"
            style={{
              flex: 1, background: COLORS.card, border: `0.5px solid ${COLORS.border}`, borderRadius: 8,
              padding: '6px 10px', color: COLORS.textPrimary, fontSize: 13, fontFamily: "'JetBrains Mono', monospace", outline: 'none',
            }}
          />
          <button
            onClick={runCompare}
            style={{
              background: COLORS.gold, color: '#1a1408', border: 'none', borderRadius: 8,
              padding: '0 14px', fontSize: 13, fontWeight: 700, cursor: 'pointer',
            }}
          >比較</button>
        </div>

        {compareLoading && (
          <div style={{ textAlign: 'center', color: COLORS.textSecondary, padding: '30px 0', fontSize: 13 }}>比較中...</div>
        )}

        {compareResults && compareResults.error && (
          <div style={{ marginTop: 10, background: COLORS.card, border: `0.5px solid ${COLORS.up}`, borderRadius: 10, padding: 14, fontSize: 13, color: COLORS.up }}>
            {compareResults.error}
          </div>

              {result.dividend.progress ? `(${result.dividend.progress})` : ''}
              <span style={{ fontSize: 11, color: COLORS.textMuted }}> ※此為董事會決議日,非最終除息交易日,實際除息日請以證交所公告為準</span>
            </InfoLine>
          )}

          {result.disposition && result.disposition.period && (
            <InfoLine color={COLORS.orange}>
              ⚠️處置股:公布日期 {result.disposition.announceDate},處置期間 {result.disposition.period}
              (累計第{result.disposition.count}次),措施:{result.disposition.measure}
            </InfoLine>
          )}

          <div style={{ marginTop: 16, background: COLORS.cardRaised, borderRadius: 10, padding: '12px 14px' }}>
            <div style={{ fontSize: 12, color: COLORS.gold, fontWeight: 700, marginBottom: 6 }}>AI分析(含短期展望)</div>
            {insightLoading && <div style={{ fontSize: 13, color: COLORS.textSecondary }}>AI分析中...</div>}
            {aiInsight && !insightLoading && (
              <>
                <div style={{ fontSize: 13, lineHeight: 1.9, color: COLORS.textPrimary }}>
                  {aiInsight.analysis.split('▲').map((seg, i) => (
                    <div key={i} style={{ marginBottom: 6 }}>{seg.trim()}</div>
                  ))}
                </div>
                {(() => {
                  const warning = checkAISignalConsistency(aiInsight.sentiment, result.conclusion);
                  return warning ? <div style={{ marginTop: 6, fontSize: 12, color: COLORS.orange, fontWeight: 700 }}>{warning}</div> : null;
                })()}
              </>
            )}
            {!aiInsight && !insightLoading && (
              <div style={{ fontSize: 12, color: COLORS.textMuted }}>
                {/* AI分析失敗時的備援:仍顯示規則式明日推測,確保這個欄位不會完全空白 */}
                {result.tomorrowOutlook ? (
                  <span style={{ color: result.tomorrowOutlook.includes('偏多') ? COLORS.up : result.tomorrowOutlook.includes('偏空') ? COLORS.down : COLORS.textSecondary }}>
                    {result.tomorrowOutlook}
                  </span>
                ) : 'AI分析產生失敗,請參考上方數據'}
                {insightDebug && <div style={{ fontSize: 10, color: COLORS.up, marginTop: 4, wordBreak: 'break-all' }}>{insightDebug}</div>}
              </div>
            )}
          </div>

          <div style={{ marginTop: 16, borderTop: `0.5px solid ${COLORS.border}`, paddingTop: 12 }}>
            <div style={{ fontSize: 12, color: COLORS.gold, fontWeight: 700, marginBottom: 8 }}>問問AI關於這檔股票</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <input
                value={question}
                onChange={e => setQuestion(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && askQuestion()}
                placeholder="例如:目前適合進場嗎?"
                style={{
                  flex: 1, background: COLORS.cardRaised, border: `0.5px solid ${COLORS.border}`, borderRadius: 8,
                  padding: '7px 10px', color: COLORS.textPrimary, fontSize: 13, outline: 'none',
                }}
              />
              <button onClick={askQuestion} style={{
                background: COLORS.gold, color: '#1a1408', border: 'none', borderRadius: 8,
                padding: '0 14px', fontSize: 12, fontWeight: 700, cursor: 'pointer',
              }}>問AI</button>
            </div>
            {askLoading && <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 8 }}>AI思考中...</div>}
            {askAnswer && !askLoading && (
              <div style={{ marginTop: 8, background: COLORS.cardRaised, borderRadius: 8, padding: '10px 12px', fontSize: 13, lineHeight: 1.7, color: COLORS.textPrimary }}>
                {askAnswer}
              </div>
            )}
            <div style={{ fontSize: 10, color: COLORS.textMuted, marginTop: 6 }}>※AI回答依據上方已查詢的資料生成,語言模型有機率產生「幻覺」(內容與實際數據不符),非投資建議,僅供參考</div>
          </div>

          {result.tradingCost && (
            <InfoLine label="交易成本試算">
              一般交易來回約 {result.tradingCost.normal}%、當沖來回約 {result.tradingCost.dayTrade}%(官方標準費率未打折,需上漲超過此幅度才開始獲利,實際成本依您券商折扣而定)
            </InfoLine>
          )}

          <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 14, lineHeight: 1.7 }}>
            以上為技術面客觀計算,並非投資建議,僅供參考。資料來源:Yahoo Finance、證交所(經代理伺服器轉發)。
            {updatedAt && <span> 更新時間:{updatedAt.toLocaleTimeString('zh-TW')}</span>}
            <br /><br />
            ※法人買賣超可能包含避險、ETF調整、大宗交易轉讓等非方向性因素,不完全代表「看多/看空」;技術指標(MA/KD/RSI/MACD)為業界通用預設參數,並未針對台股個別校準;本系統仰賴多個免費服務,查詢量大或市場劇烈波動時可能延遲或暫時無法使用。
          </div>
        </div>
      )}

      {!result && !loading && !error && (
        <div style={{ textAlign: 'center', color: COLORS.textMuted, padding: '40px 20px', fontSize: 13, lineHeight: 1.8 }}>
          輸入股票代號或中文名稱並按查詢,即可看到即時技術面分析<br />
          (上市股票可用代號或中文名稱搜尋,上櫃股票目前僅能用代號查詢)
        </div>
      )}
      </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<StockAnalyzer />);
</script>
</body>
</html>
